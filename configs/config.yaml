defaults:
  - _self_
  - paths: default
  - override hydra/launcher: joblib

hydra:
  launcher:
    n_jobs: 25
    backend: "multiprocessing"

experiment:
  name: "${data.class_a}_vs_${data.class_b}"
  save_dir: "saved"
  seed: 42

data:
  class_a: "cat"
  class_b: "dog"
  batch_size: 1
  capture_batch_idx: [0,1,2,3,4]
  repetition: 0
  original: False
  only_first_layer: False
  aggregate: False
  n_aggregate: 5

reconstruction:
  tv_coeff: 5e-3
  clip_coeff: 0.001
  num_iterations: 1000
  lr: 0.1
  reruns: 1
  guidance: False
  oracle_guidance: False
  swap_guidance: True
  n_dummy: 0
  
clip:
  model: "ViT-B/32"
  prompts: [
    "a photo of a airplane",
    "a photo of a automobile",
    "a photo of a bird",
    "a photo of a cat",
    "a photo of a deer",
    "a photo of a dog",
    "a photo of a frog",
    "a photo of a horse",
    "a photo of a ship",
    "a photo of a truck"
  ]

skip:
  clip: True
  capture: False
  reconstruct: False

wandb_log: True
group_name: "clip_false_guidance"

